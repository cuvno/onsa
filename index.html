<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音叉</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #fff; overflow: hidden; -webkit-user-select: none; }
        img { max-width: 90vw; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <img id="onsaImage" src="onsa-off.jpg">
    <script>
        let ctx = null, osc = null, gain = null, isPlaying = false;
        const img = document.getElementById('onsaImage');

        img.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            // 1. AudioContextの生成と同時に音量をセット
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                osc = ctx.createOscillator();
                gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = 440;
                gain.gain.value = 0; // 最初だけ無音で接続
                
                osc.connect(gain).connect(ctx.destination);
                osc.start();
            }

            // 2. 状態に関わらず再開
            ctx.resume();

            // 3. 複雑な予約をせず、直接値を上書きする
            if (!isPlaying) {
                gain.gain.value = 0.2; // ON（即座）
                img.src = 'onsa-on.jpg';
                isPlaying = true;
            } else {
                gain.gain.value = 0;   // OFF（即座）
                img.src = 'onsa-off.jpg';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
