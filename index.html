<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音叉</title>
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preload" as="image" href="onsa-on.jpg">
    <link rel="preload" as="image" href="onsa-off.jpg">
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #ffffff; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        #onsaImage { max-width: 90vw; max-height: 90vh; width: auto; height: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <img id="onsaImage" src="onsa-off.jpg" alt="音叉">
    <script>
        let audioCtx = null, oscillator = null, gainNode = null, isPlaying = false;
        const img = document.getElementById('onsaImage');

        function toggle() {
            // 1. 初回のみコンテキスト作成
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.connect(audioCtx.destination);
                oscillator = audioCtx.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                oscillator.connect(gainNode);
                oscillator.start();
            }

            // 2. iOS対策（常に再開命令を投げる）
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;

            if (!isPlaying) {
                // ON: 直線で0.04秒（ブツ音を消しつつ最速で鳴らす）
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0.2, now + 0.04);
                img.src = 'onsa-on.jpg';
                isPlaying = true;
            } else {
                // OFF: 直線で0.06秒（滑らかに消す）
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.06);
                img.src = 'onsa-off.jpg';
                isPlaying = false;
            }
        }

        // pointerdownで即実行（asyncは使わない）
        img.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            toggle();
        });
    </script>
</body>
</html>
