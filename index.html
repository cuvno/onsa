<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>音叉</title>
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
            /* 画面全体のテキスト選択や長押しメニューを禁止 */
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #onsaImage {
            /* 画像のサイズに合わせて数値を調整してください */
            width: 300px; 
            height: 400px;
            max-width: 90vw;
            max-height: 90vh;
            
            /* 背景画像の設定 */
            background-image: url('onsa-off.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;

            /* タップ時の反応を最適化 */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
    </style>
</head>
<body>

    <!-- imgタグではなくdivを使用 -->
    <div id="onsaImage"></div>

    <script>
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        const target = document.getElementById('onsaImage');

        const urlOn = "onsa-on.jpg";
        const urlOff = "onsa-off.jpg";

        // プリロード
        [urlOn, urlOff].forEach(url => { const i = new Image(); i.src = url; });

        target.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!oscillator) {
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.02);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                target.style.backgroundImage = `url('${urlOn}')`;

            } else {
                const now = audioCtx.currentTime;
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                oscillator.stop(now + 0.1);

                const currentOsc = oscillator;
                const currentGain = gainNode;
                currentOsc.onended = () => {
                    currentOsc.disconnect();
                    currentGain.disconnect();
                };

                oscillator = null;
                gainNode = null;
                target.style.backgroundImage = `url('${urlOff}')`;
            }
        });
    </script>
</body>
</html>
