<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- iPhoneホーム画面用のアイコン指定 -->
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- アプリっぽく全画面で起動させる設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>440Hz音叉</title>
    
    <style>
        /* 画面中央に配置するスタイル */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* 背景色はお好みで */
            overflow: hidden;
            -webkit-user-select: none; /* テキスト選択を防止 */
        }

        #onsaImage {
            max-width: 90vw;  /* 画面幅に合わせて調整 */
            max-height: 90vh;
            width: auto;      /* 比率を維持 */
            height: auto;     /* 比率を維持 */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* タップ時の青い枠を消す */
        }
    </style>
</head>
<body>

    <!-- 最初はoff画像を表示 -->
    <img id="onsaImage" src="onsa-off.jpg" alt="音叉">

    <script>
        let audioCtx = null;
        let oscillator = null;
        const imgElement = document.getElementById('onsaImage');

        // 画像タップ時の処理
        imgElement.addEventListener('click', () => {
            if (!audioCtx) {
                // 初回クリック時にオーディオ機能を開始
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!oscillator) {
                // 440Hzの音を開始
                oscillator = audioCtx.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                oscillator.connect(audioCtx.destination);
                oscillator.start();

                // 画像をONに切り替え
                imgElement.src = "onsa-on.jpg";
            } else {
                // 音を止める
                oscillator.stop();
                oscillator = null;

                // 画像をOFFに切り替え
                imgElement.src = "onsa-off.jpg";
            }
        });
    </script>
</body>
</html>
