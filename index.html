<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音叉</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; -webkit-user-select: none; }
        img { max-width: 90vw; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <img id="onsaImage" src="onsa-off.jpg">
    <script>
        let ctx = null, osc = null, gain = null, isPlaying = false;
        const img = document.getElementById('onsaImage');

        img.addEventListener('pointerdown', async (e) => {
            e.preventDefault();

            // 1. AudioContextの作成
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                osc = ctx.createOscillator();
                gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 440;
                gain.gain.value = 0;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
            }

            // 2. 起動を「待つ」。これが1回目から音を出すための決定打
            if (ctx.state === 'suspended') {
                await ctx.resume();
            }

            // 3. 起動した「後」で音量を操作する
            if (!isPlaying) {
                // ON: 即座に値をセット（ポップノイズより即時性を優先）
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                img.src = 'onsa-on.jpg';
                isPlaying = true;
            } else {
                // OFF: ここだけは少し滑らかに（ブツ音防止）
                gain.gain.setTargetAtTime(0, ctx.currentTime, 0.03);
                img.src = 'onsa-off.jpg';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
