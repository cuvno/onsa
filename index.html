<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音叉</title>
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preload" as="image" href="onsa-on.jpg">
    <link rel="preload" as="image" href="onsa-off.jpg">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        #onsaImage {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <img id="onsaImage" src="onsa-off.jpg" alt="音叉">
    <script>
        let ctx = null, osc = null, gain = null, isPlaying = false;
        const img = document.getElementById('onsaImage');

        img.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            // 1. 作成と開始を最短で行う
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                osc = ctx.createOscillator();
                gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 440;
                gain.gain.value = 0;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
            }

            // 2. iOSのブロック解除（ここが1回目に必須）
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            // 3. 複雑な予約命令(Ramp)を全削除。値を直接書き換える
            if (!isPlaying) {
                gain.gain.value = 0.2; 
                img.src = 'onsa-on.jpg';
                isPlaying = true;
            } else {
                gain.gain.value = 0;
                img.src = 'onsa-off.jpg';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
