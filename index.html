<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音叉</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; -webkit-user-select: none; }
        img { max-width: 90vw; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <img id="onsaImage" src="onsa-off.jpg">
    <script>
        let ctx = null, osc = null, gain = null, isPlaying = false;
        const img = document.getElementById('onsaImage');

        img.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            // 1. 初回のみ作成
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                osc = ctx.createOscillator();
                gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 440;
                gain.gain.setValueAtTime(0, ctx.currentTime);
                osc.connect(gain).connect(ctx.destination);
                osc.start();
            }

            // 2. 毎回必ず resume を呼ぶ
            ctx.resume();

            // 3. 「今すぐ」ではなく「0.1秒後」に音量を上げきるよう予約する
            // これが iPhone の起動ラグを抜ける一番シンプルで確実な方法です
            const t = ctx.currentTime + 0.1;

            if (!isPlaying) {
                // ON: 0.1秒かけて音を出す
                gain.gain.cancelScheduledValues(0);
                gain.gain.linearRampToValueAtTime(0.2, t);
                img.src = 'onsa-on.jpg';
                isPlaying = true;
            } else {
                // OFF: 0.1秒かけて音を消す
                gain.gain.cancelScheduledValues(0);
                gain.gain.linearRampToValueAtTime(0, t);
                img.src = 'onsa-off.jpg';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
