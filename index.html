<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音叉</title>
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preload" as="image" href="onsa-on.jpg">
    <link rel="preload" as="image" href="onsa-off.jpg">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        #onsaImage {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <img id="onsaImage" src="onsa-off.jpg" alt="音叉">
    <script>
        let audioCtx = null, oscillator = null, gainNode = null, isPlaying = false;
        const img = document.getElementById('onsaImage');

        img.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            // 1. AudioContextの生成と開始（非同期を使わず即時実行）
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
            }

            // 2. iOSのサスペンド解除
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            if (!isPlaying) {
                // ON: 0.05秒で立ち上げ（これがブツ音を防ぐ最短時間です）
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0.2, now + 0.05);
                img.src = 'onsa-on.jpg';
                isPlaying = true;
            } else {
                // OFF: 0.1秒で消去
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
                img.src = 'onsa-off.jpg';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
